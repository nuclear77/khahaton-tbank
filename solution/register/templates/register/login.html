{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - B8 Рецепты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark-red: #6A0C0C;
            --primary-matte-red: #7A1C1C;
            --accent-dark: #1A0A0A;
            --accent-darker: #0F0505;
            --card-bg: #251515;
            --text-light: #F0F0F0;
            --text-muted: #B0B0B0;
        }

        body {
            background: linear-gradient(135deg, var(--accent-darker) 0%, var(--accent-dark) 100%);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, #2A1818 100%);
            border-radius: 20px;
            border: 1px solid rgba(106, 12, 12, 0.3);
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(106, 12, 12, 0.3);
            border-radius: 10px;
            color: var(--text-light);
            padding: 12px 16px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-matte-red);
            color: var(--text-light);
            box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.2);
            outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-dark-red) 0%, var(--primary-matte-red) 100%);
            border: none;
            border-radius: 10px;
            color: var(--text-light);
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .links-section {
            text-align: center;
        }

        .register-link {
            color: var(--primary-matte-red);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link:hover {
            color: var(--text-light);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="brand-title">B8 РЕЦЕПТЫ</div>
                <div class="brand-subtitle">Войдите в свой аккаунт</div>
            </div>

            {% if form.errors %}
                <div class="error-message">
                    Неверное имя пользователя или пароль. Пожалуйста, попробуйте снова.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_username" class="form-label">Имя пользователя</label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Введите ваш username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Введите ваш пароль" required>
                </div>

                <button type="submit" class="btn-login">Войти в систему</button>

                <div class="links-section">
                    <span style="color: var(--text-muted);">Нет аккаунта? </span>
                    <a href="{% url 'register' %}" class="register-link">Зарегистрируйтесь</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
